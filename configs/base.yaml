# Frozen training configuration for every run in the sweep.
#
# These are the BabyLM 2024 strict-track winning hyperparameters (Samuel et al.
# 2023, LTG-BERT). Do NOT tune them per construction or per dose: holding the
# config fixed across all 60 runs is what makes the dose-response comparison
# clean, and tuning would invite reviewer concern about p-hacking.

model:
  architecture: ltg-bert-base
  hidden_size: 384
  num_hidden_layers: 12
  num_attention_heads: 6
  intermediate_size: 1024
  max_position_embeddings: 128
  vocab_size: 16384

training:
  batch_size: 256          # sequences; 256 * 128 = 32,768 tokens / step
  max_seq_length: 128
  learning_rate: 1.0e-3
  warmup_ratio: 0.1
  lr_schedule: cosine      # decay to 0
  optimizer: adamw
  adam_beta1: 0.9
  adam_beta2: 0.98
  adam_epsilon: 1.0e-6
  weight_decay: 0.1
  num_epochs: 20
  mlm_probability: 0.15
  whole_word_masking: true
  max_grad_norm: 1.0
  precision: bf16
  log_every_n_steps: 100
  save_every_n_epochs: 5
  # Held-out slice (word count) carved off each corpus for perplexity tracking.
  heldout_words: 100000

evaluation:
  # Acceptance band for the pilot (C1=aann at dose=all, seed=42): final held-out
  # perplexity below this, and AANN minimal-pair accuracy inside [0.55, 0.75]
  # to replicate Misra & Mahowald (2024).
  pilot_max_perplexity: 40.0
  pilot_aann_acc_range: [0.55, 0.75]
  # Sweep-wide sanity band for held-out perplexity.
  perplexity_range: [15.0, 40.0]

# BabyLM data sources on the Hugging Face Hub. These are the official 2026
# edition repos (per-domain `<domain>.train.txt` files). When BabyLM re-releases,
# point these at the new edition — the download stage reads them from here, so
# no code change is needed. Current repos are linked from https://babylm.github.io.
data:
  strict_small_repo: BabyLM-community/BabyLM-2026-Strict-Small   # the 10M train set
  strict_repo: BabyLM-community/BabyLM-2026-Strict               # 100M set -> replacement pool

# Tiered experiment design (NOT a full factorial). See src/drc/design.py.
# E0 is measured for every construction (dose 0); the full dose ladder is fit
# only for the `core` subset; one shared full-corpus model per seed is the
# ceiling (E_max) for all. This holds 8 constructions at ~the cost of the old
# naive 4x5x3 grid. Run count = len(drc.design.run_cells(config)).
design:
  core_constructions:                 # full dose-response curve (+ shared E_max)
    - aann
    - comparative_correlative
    - tough_movement
    - resultative
  breadth_constructions:              # E0 (dose 0) only, for the indirect-evidence index
    - existential_there
    - it_cleft
    - negative_inversion
    - subject_to_object_raising
  core_doses: [0, 4, 16, 64]          # intermediate counts; "all" comes from the shared model
  breadth_doses: [0]
  seeds: [42, 43, 44]
  shared_full_corpus: true            # train the unfiltered-corpus model once per seed

paths:
  raw_corpus: data/raw/babylm_10M.txt          # downloaded corpus: domain<TAB>text per line
  replacement_pool: data/raw/babylm_100M_pool.txt
  parsed: data/parsed/babylm_10M.conllu        # Stanza parse of the training corpus
  parsed_pool: data/parsed/babylm_100M_pool.conllu  # Stanza parse of the replacement pool
  filtered: data/filtered
  dose_corpora: data/dose_corpora
  tokenizer: models/tokenizer
  models: models
  eval_items: evaluation/eval_items
  results: results
