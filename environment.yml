# Conda environment for the full pipeline, including the GPU training stack.
# For a CPU-only / analysis-only setup, `pip install -e .` is enough.
name: drc-emnlp-2026
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pytorch>=2.1
  - pytorch-cuda=12.1
  - pip:
      - transformers>=4.40
      - tokenizers>=0.15
      - safetensors>=0.4
      - accelerate>=0.28
      - datasets>=2.18
      - stanza>=1.7
      - pytest>=7.4
      - ruff>=0.4
      # - anthropic>=0.25  # uncomment for LLM-as-judge QA
